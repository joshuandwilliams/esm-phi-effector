paths:
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  splits_dir: "data/splits"
  metadata_file: "phi-base_current.csv"
  fasta_file: "phi-base_current.fas"

target_mapping:
  "Effector": 0
  "Transcription factor / Regulator": 1
  "Kinase / Signalling": 2
  "Protease": 3
  "Cell wall / Carbohydrate-active": 4
  "Transporter / Membrane": 5
  "Secondary metabolite / Biosynthesis": 6
  "Secretion system": 7

filtering:
  min_seq_length: 50
  max_seq_length: 1500
  max_ambiguity_fraction: 0.0
  max_poly_x_run: 10
  max_single_aa_fraction: 0.35

clustering:
  identity_threshold: 0.9
  coverage_threshold: 0.8

splitting:
  test_size: 0.1
  random_seed: 42