lora:
  rank: 8
  alpha: 16
  dropout: 0.1
  target_modules:
    - "query"
    - "key"
    - "value"
    - "dense"
  bias: "none"

models:
  small: "facebook/esm2_t30_150M_UR50D"
  large: "facebook/esm2_t33_650M_UR50D"

training:
  num_epochs: 20
  per_device_train_batch_size: 8
  per_device_eval_batch_size: 16
  gradient_accumulation_steps: 2    # effective batch size = 8x2 = 16
  learning_rate: 2.0e-4
  weight_decay: 0.01
  warmup_ratio: 0.1
  lr_scheduler_type: "cosine"
  fp16: true
  early_stopping_patience: 3
  early_stopping_threshold: 0.001
  k_folds: 5

evaluation:
  strategy: "epoch"
  save_strategy: "epoch"
  save_total_limit: 3
  metric_for_best_model: "eval_f1_macro"
  greater_is_better: true
  load_best_model_at_end: true

logging:
  steps: 50
  report_to: "wandb"
  project_name: "esm-phi-effector"

paths:
  output_dir: "data/checkpoints/lora_finetune"
  deployment_dir: "data/checkpoints/deployment"