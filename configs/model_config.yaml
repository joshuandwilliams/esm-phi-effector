model:
  base_model: "facebook/esm2_t30_150M_UR50D"
  hidden_dim: 640          # ESM-2 150M embedding dimension
  num_classes: 8           # Number of functional classes
  dropout_rate: 0.1

classification_head:
  layer_1_dim: 256
  layer_2_dim: 128
  pooling: "mean"          # mean pooling over sequence length vs cls token

training:
  batch_size: 8
  learning_rate: 1.0e-4
  max_epochs: 50
  early_stopping_patience: 5

memory:
  max_token_length: 1024
  test_batch_sizes: [2, 4, 8, 16]   # for memory profiling

paths:
  splits_dir: "data/splits"
  checkpoint_dir: "data/checkpoints"
  embeddings_dir: "data/splits/frozen_embeddings"